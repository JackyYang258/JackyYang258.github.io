name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race for the gh-pages branch.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CV PDF
        id: cv
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - name: Stage static site
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude dist \
            --exclude .git \
            --exclude .github \
            --exclude _bibliography \
            --exclude cv.tex \
            --exclude README.md \
            --exclude LICENSE \
            --exclude .gitignore \
            --exclude .gitattributes \
            --exclude 'cv.*'
          # Published under assets/ with a descriptive filename (it is also
          # what the browser saves it as).
          if [ -f cv.pdf ]; then
            cp cv.pdf dist/assets/siqi-yang-cv.pdf
            echo "CV PDF included at /assets/siqi-yang-cv.pdf"
          else
            echo "::warning::cv.pdf was not built; site deploys without it"
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
