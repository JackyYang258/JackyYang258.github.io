name: Build CV

# GitHub Pages serves this repo's `main` branch directly, so there is no
# site build step. The only thing CI does is regenerate cv.pdf from cv.tex
# and commit it back, because the LaTeX packages it needs are awkward to
# install locally.

on:
  push:
    branches:
      - main
    paths:
      - "cv.tex"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile cv.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - name: Commit the PDF if it changed
        run: |
          mv cv.pdf assets/siqi-yang-cv.pdf
          if git diff --quiet -- assets/siqi-yang-cv.pdf; then
            echo "CV unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/siqi-yang-cv.pdf
          git commit -m "Rebuild CV PDF from cv.tex"
          git push
